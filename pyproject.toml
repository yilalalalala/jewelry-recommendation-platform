[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "jewelrank"
version = "1.0.0"
description = "Explainable full-stack jewelry recommendation platform"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Yila Cao"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
jewelrank = "jewelrank.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jewelrank"]

[tool.pytest.ini_options]
addopts = "-q --cov=jewelrank --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
