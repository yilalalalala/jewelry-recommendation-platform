services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jewelrank:jewelrank@db:5432/jewelrank
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jewelrank
      POSTGRES_USER: jewelrank
      POSTGRES_PASSWORD: jewelrank
    ports: ["5432:5432"]
